{% extends 'aplicacion/layout_1.html' %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/aplicacion/formularios.css') }}">
{% endblock %}
{% block content %}
<div class="form-breadcrumb">
  <a href="{{ url_for('valoraciones.ver_materia', materia_id=actividad.materia_id) }}">Valoraciones</a>
  <span class="sep">/</span>
  <span>Editar Actividad</span>
</div>
<div class="form-page">
  <div class="form-card">
    <div class="form-card-header"><h2>Editar Actividad</h2></div>
    <form method="POST" action="{{ url_for('valoraciones.editar_actividad', actividad_id=actividad.id) }}">
      <div class="form-card-body">
        <div class="form-section">
          <div class="form-group">
            <label class="form-label">Nombre <span class="required">*</span></label>
            <input type="text" name="nombre" class="form-control" value="{{ actividad.nombre }}" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Tipo <span class="required">*</span></label>
              <select name="tipo" class="form-control" required>
                <option value="tarea" {% if actividad.tipo == 'tarea' %}selected{% endif %}>Tarea</option>
                <option value="examen" {% if actividad.tipo == 'examen' %}selected{% endif %}>Examen</option>
                <option value="participacion" {% if actividad.tipo == 'participacion' %}selected{% endif %}>Participación</option>
                <option value="proyecto" {% if actividad.tipo == 'proyecto' %}selected{% endif %}>Proyecto</option>
                <option value="otro" {% if actividad.tipo == 'otro' %}selected{% endif %}>Otro</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">% Peso <span class="required">*</span></label>
              <input type="number" name="porcentaje" class="form-control" min="0" max="100" step="0.5"
                     value="{{ actividad.porcentaje }}" required>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" class="form-control" value="{{ actividad.fecha }}">
          </div>
        </div>
      </div>
      <div class="form-card-footer">
        <a href="{{ url_for('valoraciones.ver_materia', materia_id=actividad.materia_id) }}" class="btn">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
