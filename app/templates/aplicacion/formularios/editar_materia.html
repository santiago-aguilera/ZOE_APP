{% extends 'aplicacion/layout_1.html' %}
{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/aplicacion/formularios.css') }}">
{% endblock %}

{% block content %}
<div class="form-breadcrumb">
  <a href="{{ url_for('configuracion.configuracion') }}">Administración</a>
  <span class="sep">/</span>
  <span>{{ 'Editar Materia' if materia else 'Crear Materia' }}</span>
</div>
<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <h2>{{ 'Editar Materia' if materia else 'Crear Materia' }}</h2>
    </div>
    <!-- Cambiamos el action según si estamos editando o creando -->
    <form method="POST"
          action="{{ url_for('materias.editar_materia', materia_id=materia.id) if materia else url_for('materias.form_crear_materia') }}">
      <div class="form-card-body">
        <div class="form-section">
          <div class="form-section-title">Información de la materia</div>
          <div class="form-group">
            <label class="form-label">Nombre de la materia <span class="required">*</span></label>
            <input type="text" name="nombre" class="form-control" placeholder="Ej: Matemáticas HL"
                   value="{{ materia.nombre if materia else '' }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Cohorte académica</label>
            <select name="cohorte_id" class="form-control">
              <option value="">Sin asignar</option>
              {% for p in cohortes %}
              <option value="{{ p.id }}" {% if materia and materia.cohorte_id == p.id %}selected{% endif %}>{{ p.nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Descripción</label>
            <textarea name="descripcion" class="form-control" rows="3"
                      placeholder="Descripción breve de la materia...">{{ materia.descripcion if materia else '' }}</textarea>
          </div>
        </div>
      </div>
      <div class="form-card-footer">
        <a href="{{ url_for('configuracion.configuracion') }}" class="btn">Cancelar</a>
        <button type="submit" class="btn btn-primary">{{ 'Guardar cambios' if materia else 'Crear materia' }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
