{% extends 'aplicacion/layout_1.html' %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/aplicacion/formularios.css') }}">
{% endblock %}

{% block content %}
<div class="form-breadcrumb">
  <a href="{{ url_for('configuracion.configuracion') }}">Administración</a>
  <span class="sep">/</span>
  <span>{{ 'Editar Grupo' if grupo else 'Crear Grupo' }}</span>
</div>
<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <h2>{{ 'Editar Grupo' if grupo else 'Crear Grupo' }}</h2>
    </div>
    <!-- Cambiamos el action según si estamos editando o creando -->
    <form method="POST"
          action="{{ url_for('grupos.editar_grupo', grupo_id=grupo.id) if grupo else url_for('grupos.form_crear_grupo') }}">
      <div class="form-card-body">
        <div class="form-section">
          <div class="form-section-title">Información del grupo</div>
          <div class="form-group">
            <label class="form-label">Nombre del grupo <span class="required">*</span></label>
            <input type="text" name="nombre" class="form-control" placeholder="Ej: Grupo A — Matemáticas"
                   value="{{ grupo.nombre if grupo else '' }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Materia <span class="required">*</span></label>
            <select name="materia_id" class="form-control" required>
              <option value="">Seleccionar...</option>
              {% for m in materias %}
              <option value="{{ m.id }}" {% if grupo and grupo.materia_id == m.id %}selected{% endif %}>{{ m.nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Profesor asignado</label>
            <select name="profesor_id" class="form-control">
              <option value="">Sin asignar</option>
              {% for p in profesores %}
              <option value="{{ p.id }}" {% if grupo and grupo.profesor_id == p.id %}selected{% endif %}>{{ p.nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Descripción</label>
            <textarea name="descripcion" class="form-control" rows="3"
                      placeholder="Notas sobre el grupo...">{{ grupo.descripcion if grupo else '' }}</textarea>
          </div>
        </div>
      </div>
      <div class="form-card-footer">
        <a href="{{ url_for('configuracion.configuracion') }}" class="btn">Cancelar</a>
        <button type="submit" class="btn btn-primary">{{ 'Guardar cambios' if grupo else 'Crear grupo' }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
